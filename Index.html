
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SINISTER | Online Store</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f5f5;color:#171717}
header{background:#111;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:26px;font-weight:900;letter-spacing:3px}
nav{display:flex;gap:18px}
nav a{color:white;text-decoration:none;font-size:14px}
.hero{background:#171717;color:white;padding:65px 7%;text-align:center}
.hero h1{font-size:42px;letter-spacing:3px}
.hero p{margin:15px 0;color:#ccc}
.hero button{padding:13px 28px;background:white;border:0;font-weight:bold;cursor:pointer}
h2{padding:25px 5% 10px}
.products{padding:15px 5%;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px}
.product{background:white;border-radius:9px;overflow:hidden;box-shadow:0 2px 8px #ddd}
.product img{width:100%;height:190px;object-fit:contain;background:#eee}
.info{padding:13px}
.info h3{font-size:16px;margin-bottom:8px}
.price{font-weight:bold;font-size:19px}
.old{color:#888;text-decoration:line-through;font-size:13px;margin-left:7px}
.info button{width:100%;padding:11px;margin-top:12px;background:#111;color:white;border:0;cursor:pointer}
footer{background:#111;color:white;text-align:center;padding:25px;margin-top:35px}
</style>
</head>
<body>
<header>
<div class="logo">SINISTER.</div>
<nav>
<a href="#">Home</a>
<a href="#products">Shop</a>
<a href="#footer">Contact</a>
</nav>
</header>

<section class="hero">
<h1>WELCOME TO SINISTER</h1>
<p>Discover products. Shop smarter.</p>
<button onclick="document.getElementById('products').scrollIntoView()">SHOP NOW</button>
</section>

<h2>Latest Products</h2>
<div class="products" id="products">
<p>Products will appear here.</p>
</div>

<footer id="footer">
<h3>SINISTER STORE</h3>
<p>Thank you for shopping with us.</p>
</footer>
</body>
</html>
